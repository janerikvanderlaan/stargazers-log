<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carnet des étoiles</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Une sélection de projets inspirants</p>
        <h1>Carnet des étoiles</h1>
        <p class="intro">Les dépôts GitHub que j’ai ajoutés à mes favoris.</p>
      </header>
      <section aria-labelledby="repositories-heading">
        <h2 id="repositories-heading">Dépôts étoilés</h2>
        <p id="repositories-status" class="status" role="status" aria-live="polite">Chargement des dépôts…</p>
        <ul id="repositories-list" class="repository-list"></ul>
      </section>
    </main>
  </body>
</html>
